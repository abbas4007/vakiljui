server {
    listen 80;
    server_name www.vakiljuy.ir 94.101.187.170;

    # Certbot challenge (اگه لازم شد مستقیم روی این هاست‌نیم‌ها هم چک بشه)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vakiljuy.ir$request_uri;
    }
}

########################################################################
# بلاک ۲: سرور اصلی - فقط vakiljuy.ir (بدون www)
# SSL توسط Cloudflare/ArvanCloud ترمینیت میشه، این بلاک فقط http (80) رو
# از CDN دریافت می‌کنه، نیازی به listen 443 روی خود این سرور نیست.
########################################################################
server {
    listen 80;
    server_name vakiljuy.ir;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://dadvar_web:8000;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # نکته مهم: چون SSL روی خود این سرور ترمینیت نمی‌شه (Cloudflare/ArvanCloud
        # این کار رو می‌کنه و بعد با http معمولی به این بلاک وصل می‌شه)، مقدار
        # $scheme همیشه از دید خود Nginx برابر با "http" است - حتی وقتی کاربر
        # واقعی با https وصل شده. قبلاً همین باعث می‌شد Django فکر کنه درخواست
        # http بوده و canonical/og:url و JSON-LD همه با http:// ساخته بشن.
        # چون این بلاک همیشه پشت CDN با HTTPS اجباری قرار داره (بلاک بالا هم
        # www را به https ریدایرکت می‌کند)، اینجا مقدار را مستقیم https هاردکد
        # کردیم. فقط مطمئن شو در پنل Cloudflare/ArvanCloud گزینه‌ی
        # "Always Use HTTPS" / "Force HTTPS" روشن است.
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}