{% extends 'base.html' %}

{% block title %}درخواست ارسال شد | وکیل جو{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow text-center rounded-4">

                <div class="card-body p-5">

                    <i class="bi bi-check-circle text-success display-2"></i>

                    <h1 class="h3 mt-4">
                        درخواست شما ثبت شد
                    </h1>

                    <p class="text-muted mt-3">
                        اطلاعات و مدارک شما با موفقیت دریافت شد.
                        درخواست شما توسط مدیریت بررسی خواهد شد.
                    </p>

                    <a
                        href="{% url 'accounts:lawyer_verification_status' %}"
                        class="btn btn-primary mt-3"
                    >
                        مشاهده وضعیت درخواست
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
