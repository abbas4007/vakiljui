{% extends "base.html" %}
{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <h1 class="h4 mb-4">تنظیمات مشاوره‌ی آنلاین</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" name="is_available" id="is_available"
                {% if setting.is_available %}checked{% endif %}>
            <label class="form-check-label" for="is_available">
                آماده‌ی پذیرش مشاوره هستم
            </label>
        </div>

        <hr>

        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="chat_enabled" id="chat_enabled"
                {% if setting.chat_enabled %}checked{% endif %}>
            <label class="form-check-label" for="chat_enabled">مشاوره‌ی متنی (چت)</label>
        </div>
        <div class="mb-3">
            <label class="form-label">قیمت مشاوره‌ی متنی (تومان)</label>
            <input type="number" min="0" step="1000" class="form-control" name="chat_price" value="{{ setting.chat_price }}">
        </div>

        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" name="voice_enabled" id="voice_enabled"
                {% if setting.voice_enabled %}checked{% endif %}>
            <label class="form-check-label" for="voice_enabled">مشاوره‌ی تلفنی</label>
        </div>
        <div class="mb-3">
            <label class="form-label">قیمت مشاوره‌ی تلفنی (تومان)</label>
            <input type="number" min="0" step="1000" class="form-control" name="voice_price" value="{{ setting.voice_price }}">
        </div>

        <div class="mb-4">
            <label class="form-label">مدت هر جلسه (دقیقه)</label>
            <input type="number" min="5" step="5" class="form-control" name="session_minutes" value="{{ setting.session_minutes }}">
        </div>

        <button type="submit" class="btn btn-primary">ذخیره‌ی تنظیمات</button>
    </form>

    <p class="text-muted small mt-4">
        ۲۰٪ از مبلغ هر مشاوره کمیسیون سایته؛ بقیه هفتگی/ماهانه بهت تسویه میشه.
    </p>
</div>
{% endblock %}
